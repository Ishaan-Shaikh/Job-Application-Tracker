
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Tracker · Add Job</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <nav>
      <div class="logo"><span>📋</span> JobTrack</div>
      <div class="nav-links">
        <a href="index.html">Dashboard</a>
        <a href="jobs.html">All Jobs</a>
        <a href="add.html" class="active">Add Job</a>
        <a href="about.html">About</a>
      </div>
    </nav>

    <div class="card">
      <h1 id="form-title">Add Job</h1>
      <div class="subhead" id="form-subhead">Track a new application</div>

      <form id="job-form">
        <div class="form-row">
          <div class="form-group">
            <label>Job Title *</label>
            <input type="text" id="job-title" required placeholder="e.g. Frontend Developer">
          </div>
          <div class="form-group">
            <label>Company *</label>
            <input type="text" id="job-company" required placeholder="e.g. Acme Corp">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Status</label>
            <select id="job-status">
              <option value="applied">Applied</option>
              <option value="interview">Interview</option>
              <option value="offer">Offer</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
          <div class="form-group">
            <label>Location</label>
            <input type="text" id="job-location" placeholder="Remote, Hybrid...">
          </div>
        </div>

        <div class="form-group">
          <label>Date Applied</label>
          <input type="date" id="job-date">
        </div>

        <div class="form-group">
          <label>Notes</label>
          <textarea id="job-notes" placeholder="Any extra details..."></textarea>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.8rem;">
          <button type="submit" class="btn" style="flex:1;" id="submit-btn">Save Job</button>
          <a href="jobs.html" class="btn btn-outline" style="flex:1; text-decoration:none;">Cancel</a>
        </div>
      </form>
    </div>

    <footer>Simple job tracker · vanilla JS · 4 pages</footer>
  </div>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      initAddJobPage();
    });
  </script>
</body>
</html>
